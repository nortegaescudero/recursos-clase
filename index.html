<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recursos de clase</title>
  <link rel="stylesheet" href="css/estilos.css?v=2">
  <link rel="icon" href="img/logo_nico.png">
</head>
<body>
  <header class="cabecera">
    <div class="contenedor marca">
      <img class="logo" src="img/logo_nico.png" alt="Logo de Nico Games">
      <div>
        <h1 id="titulo">Recursos de clase</h1>
        <p id="subtitulo" class="subtitulo"></p>
      </div>
    </div>
  </header>

  <main class="contenedor">
    <div class="herramientas">
      <input id="buscador" class="buscador" type="search" placeholder="Buscar recurso..." aria-label="Buscar recurso">
      <div id="filtros" class="filtros" role="group" aria-label="Filtrar por tema"></div>
    </div>

    <div id="rejilla" class="rejilla"></div>
    <p id="vacio" class="vacio" hidden>No hay recursos que coincidan con la búsqueda.</p>
  </main>

  <dialog id="reproductor" class="reproductor">
    <div class="reproductor-barra">
      <h2 id="video-titulo"></h2>
      <button id="cerrar-video" type="button" class="cerrar" aria-label="Cerrar vídeo">✕</button>
    </div>
    <video id="video" controls playsinline></video>
  </dialog>

  <script src="js/recursos.js"></script>
  <script src="js/portal.js"></script>
</body>
</html>
